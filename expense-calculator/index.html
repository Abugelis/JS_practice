<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="styles.css">
        <script src="main.js" defer></script>

        <title>Expense Calculator</title>

    </head>
    <body>
        <div class="tracker">

            <h1>Expense Tracker</h1>

            <form id="transaction-form">

                <!-- Type -->
                <div class="form-group">
                <label for="type">Type</label>
                <select id="type" name="type">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" />
                </div>
                <div id="amount-error"></div>

                <!-- Category (only really matters for expenses) -->
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="general">General</option>
                        <option value="bills">Bills</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="travel">Travel</option>
                        <option value="food">Food</option>
                        <option value="once_off">Once-off</option>
                    </select>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" placeholder="e.g. Tesco groceries" />
                </div>

                <div id="description-error"></div>

                <!-- Submit -->
                <button id="add-trans-btn" class="main-btn" type="button">Add Transaction</button>
                <!-- Delete -->
                 <button id="delete-trans-btn" class="main-btn" type="delete">Delete Transaction</button>
                <!-- Edit -->
                <button id="edit-trans-btn" class="main-btn" type="submit">Edit Transaction</button>

            </form>

        </div>

        <div class="display" id="display">
        
        </div>
    </body>
</html>
