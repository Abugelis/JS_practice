<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="styles.css">
        <script src="main.js" defer></script>

        <title>To-Do App</title>

    </head>

    <body>
        <header>

        </header>

        <main>
            
            <div class="sub-head">
                <h1>To-Do</h1>
            </div>
            
            <div class="task-input-wrapper">
                <label for="task-input">Add Task</label>
                <input type="text" id="task-input" name="task-input" aria-label="user input">
                <button class="primary-btn" id="add-task-btn" type="button">Add</button>
            </div>
            
            <div class="display-container">
                <div class="to-do-column">
                    <h2>To-Do</h2>
                    <div class="to-do-tasks" id="to-do-tasks"></div>
                </div>
                <div class="active-column">
                    <h2>Active Tasks</h2>
                    <div class="active-tasks" id="active-tasks"></div>
                </div>
                <div class="completed-column">
                    <h2>Completed Tasks</h2>
                    <div class="completed-tasks" id="completed-tasks"></div>
                </div>
            </div>
        
        </main>

        <footer>

        </footer>
    </body>
</html>>
